name: pruebas

on:
  push:
    branches: [main]
  pull_request:

jobs:
  servicio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --release
        working-directory: servicio

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: plugin
      - run: npm run build
        working-directory: plugin
