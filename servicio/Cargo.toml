[package]
name = "cider-mv"
version = "0.1.0"
edition = "2021"
description = "Servicio local que busca y resuelve videoclips de YouTube para el plugin Videoclip de Cider"

[dependencies]
form_urlencoded = "1"
serde_json = "1"
tiny_http = "0.12"

[profile.release]
opt-level = "s"
lto = true
strip = true
